name: EAS build

on:
  push:
    branches: [main]
    paths-ignore:
      - 'hosting/**'
      - 'store-assets/**'
      - '**/*.md'
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        type: choice
        options: [all, ios, android]
        default: all

concurrency:
  group: eas-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx jest

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - run: eas build --platform ${{ inputs.platform || 'all' }} --profile production --non-interactive --no-wait
